  var ITER = 310000;
  var CAMP = 'ruckus';
  var NUM  = 3;
  var STORE_KEY = 'hunt_key_' + CAMP;

  var form   = document.getElementById('gate-form');
  var input  = document.getElementById('pw');
  var button = document.getElementById('go');
  var msg    = document.getElementById('msg');
  var note   = document.getElementById('gate-note');
  var host   = document.getElementById('doll-host');

  var doll = Hunt.svg({ label: 'Daruma' });
  doll.querySelector('.daruma__eye--l').classList.add('daruma__eye--open');
  host.appendChild(doll);

  var attempts = 0;

  function say(text) {
    msg.textContent = text;
    msg.classList.toggle('altimeter__error--on', Boolean(text));
  }

  function bytes(b64) {
    var raw = atob(b64);
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  if (!window.crypto || !window.crypto.subtle) {
    say('This page needs a secure (https://) connection to open.');
    button.disabled = true;
    return;
  }

  function unlock(password) {
    var enc = new TextEncoder();
    return crypto.subtle
      .importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (material) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' },
          material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, bytes(DATA));
      })
      .then(function (plain) { return new TextDecoder().decode(plain); });
  }

  function reveal(html, password) {
    // Cache the working key so a refresh doesn't force re-entry.
    try { localStorage.setItem(STORE_KEY, password); } catch (e) {}
    Hunt.clear(CAMP, NUM);
    document.open();
    document.write(html);
    document.close();
  }

  // Acclimatisation. The mountain holds you at each camp for a spell.
  function holdGate() {
    var left = Hunt.gateRemaining();
    if (left > 0) {
      button.disabled = true;
      note.textContent = 'Altitude. Give it ' + left + 's before pushing on.';
      window.setTimeout(holdGate, 1000);
    } else {
      button.disabled = false;
      note.textContent = '';
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (Hunt.gateRemaining() > 0) return;

    var password = Hunt.normalizeElevation(input.value);
    if (!password) return;

    button.disabled = true;
    say('');

    unlock(password)
      .then(function (html) { reveal(html, password); })
      .catch(function () {
        attempts++;
        Hunt.countFail(NUM, attempts);
        // Nanakorobi yaoki. The doll wobbles and rights itself.
        Hunt.wobble(doll);
        say('Wrong altitude. You are not where you think you are.');
        button.disabled = false;
        input.select();
      });
  });

  // A cached key opens the camp without a prompt.
  var stored = null;
  try { stored = localStorage.getItem(STORE_KEY); } catch (e) {}
  if (stored) {
    unlock(stored)
      .then(function (html) { reveal(html, stored); })
      .catch(function () { try { localStorage.removeItem(STORE_KEY); } catch (e) {} holdGate(); });
  } else {
    holdGate();
  }
})();

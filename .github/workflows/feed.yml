name: Rebuild RSS feed

on:
  push:
    branches: [master]
    paths:
      - posts.json
      - tools/build-feed.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build feed.xml from posts.json
        run: node tools/build-feed.mjs
      - name: Commit the feed if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --staged --quiet || git commit -m "Rebuild feed.xml from posts.json"
          git push

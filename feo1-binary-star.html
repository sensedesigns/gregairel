<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>FEO1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Spectral:ital,wght@0,300;0,400&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d1c;
    --ink:#e9e6f0;
    --muted:#8b87a0;
    --her:#e8b34b;
    --her-soft:rgba(232,179,75,.14);
    --him:#8aa8ff;
    --him-soft:rgba(138,168,255,.14);
    --line:rgba(233,230,240,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Spectral',Georgia,serif;
    font-weight:300;
  }
  .sky{position:fixed;inset:0;pointer-events:none;z-index:0}
  .sky::before,.sky::after{content:"";position:absolute;inset:0}
  .sky::before{
    background:
      radial-gradient(38rem 26rem at 12% 8%, var(--her-soft), transparent 65%),
      radial-gradient(40rem 30rem at 88% 92%, var(--him-soft), transparent 65%),
      radial-gradient(60rem 40rem at 50% 120%, rgba(20,16,44,.9), transparent 70%);
  }
  .sky::after{
    background-image:
      radial-gradient(1px 1px at 22px 44px, rgba(255,255,255,.7), transparent 55%),
      radial-gradient(1px 1px at 120px 90px, rgba(255,255,255,.4), transparent 55%),
      radial-gradient(1.5px 1.5px at 200px 30px, rgba(255,255,255,.55), transparent 55%),
      radial-gradient(1px 1px at 300px 140px, rgba(255,255,255,.35), transparent 55%),
      radial-gradient(1px 1px at 70px 180px, rgba(255,255,255,.5), transparent 55%),
      radial-gradient(1.5px 1.5px at 260px 210px, rgba(255,255,255,.3), transparent 55%),
      radial-gradient(1px 1px at 160px 250px, rgba(255,255,255,.45), transparent 55%);
    background-size:340px 280px;
    opacity:.5;
  }
  .wrap{
    position:relative;z-index:1;
    min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:1.5rem;
  }
  .gate{
    width:100%;max-width:22rem;
    display:flex;flex-direction:column;align-items:center;gap:1.15rem;
    text-align:center;
  }
  .gate svg{width:100%;max-width:15rem;display:block}
  .eyebrow{
    font-family:'Space Grotesk',sans-serif;
    font-size:.66rem;letter-spacing:.32em;text-transform:uppercase;
    color:var(--muted);
  }
  h1{
    font-family:'Fraunces',serif;font-weight:340;
    font-size:clamp(2.1rem,9vw,2.7rem);
    line-height:1.05;letter-spacing:-.01em;
  }
  h1 em{font-style:italic;font-weight:300}
  .for{
    font-family:'Space Grotesk',sans-serif;font-size:.7rem;
    letter-spacing:.3em;text-transform:uppercase;color:var(--muted);
  }
  .for b{color:var(--ink);font-weight:500}
  form{width:100%;display:flex;flex-direction:column;gap:.7rem;margin-top:.2rem}
  label{
    font-family:'Space Grotesk',sans-serif;
    font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);
  }
  input{
    width:100%;
    background:rgba(233,230,240,.05);
    border:1px solid var(--line);
    border-radius:.55rem;
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    font-size:1rem;letter-spacing:.18em;text-align:center;
    padding:.85rem 1rem;
    transition:border-color .2s;
  }
  input:focus{outline:none;border-color:var(--her)}
  input::placeholder{color:rgba(139,135,160,.5);letter-spacing:.18em}
  button{
    width:100%;
    background:none;border:1px solid var(--line);
    border-radius:.55rem;color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;
    padding:.85rem 1rem;cursor:pointer;
    transition:border-color .2s,color .2s,opacity .2s;
  }
  button:hover:not(:disabled),button:active:not(:disabled){border-color:var(--her);color:var(--her)}
  button:disabled{opacity:.5;cursor:default}
  .msg{
    min-height:1.2rem;
    font-style:italic;font-size:.9rem;color:var(--muted);
  }
  .msg.err{color:var(--her)}
  @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.45}}
  .tw{animation:twinkle 3.2s ease-in-out infinite}
  .tw2{animation:twinkle 4.1s ease-in-out infinite .8s}
  @media (prefers-reduced-motion:reduce){.tw,.tw2{animation:none}}
</style>
</head>
<body>
<div class="sky"></div>

<div class="wrap">
  <div class="gate">
    <svg viewBox="0 0 320 120" aria-hidden="true">
      <circle class="glow-her tw" cx="60" cy="60" r="16" fill="var(--her)" opacity=".18"/>
      <circle class="tw" cx="60" cy="60" r="5" fill="var(--her)"/>
      <circle class="tw2" cx="260" cy="60" r="16" fill="var(--him)" opacity=".18"/>
      <circle class="tw2" cx="260" cy="60" r="5" fill="var(--him)"/>
      <line x1="156" y1="60" x2="164" y2="60" stroke="rgba(233,230,240,.45)" stroke-width="1"/>
      <line x1="160" y1="56" x2="160" y2="64" stroke="rgba(233,230,240,.45)" stroke-width="1"/>
    </svg>
    <p class="eyebrow">FEO1</p>
    <h1>Binary <em>Star</em></h1>
    <p class="for">For <b>Ellie</b> Only</p>
    <form id="gate-form" autocomplete="off">
      <label for="pw">Password</label>
      <input id="pw" name="pw" type="password" inputmode="text"
             autocomplete="off" autocapitalize="off" autocorrect="off"
             spellcheck="false" placeholder="&middot; &middot; &middot; &middot; &middot; &middot;" required>
      <button type="submit" id="go">Unlock</button>
    </form>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </div>
</div>

  var ITER = 310000;
  var STORE_KEY = 'feo1-binary-star';

  var form = document.getElementById('gate-form');
  var input = document.getElementById('pw');
  var button = document.getElementById('go');
  var msg = document.getElementById('msg');

  function say(text, isError) {
    msg.textContent = text;
    msg.className = isError ? 'msg err' : 'msg';
  }

  function bytes(b64) {
    var raw = atob(b64);
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  // Uppercased + trimmed so phone autocapitalize and stray spaces don't matter.
  function normalize(pw) {
    return pw.trim().toUpperCase();
  }

  if (!window.crypto || !window.crypto.subtle) {
    say('This page needs a secure (https://) connection to open.', true);
    button.disabled = true;
    return;
  }

  function unlock(password) {
    var enc = new TextEncoder();
    return crypto.subtle
      .importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (material) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' },
          material,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, bytes(DATA));
      })
      .then(function (plain) {
        return new TextDecoder().decode(plain);
      });
  }

  function reveal(html) {
    try {
      sessionStorage.setItem(STORE_KEY, input.value ? normalize(input.value) : stored);
    } catch (e) { /* private browsing — fine, just re-prompt next time */ }
    document.open();
    document.write(html);
    document.close();
  }

  var stored = null;
  try {
    stored = sessionStorage.getItem(STORE_KEY);
  } catch (e) { /* sessionStorage unavailable */ }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var password = normalize(input.value);
    if (!password) return;

    button.disabled = true;
    say('Opening…', false);

    unlock(password).then(reveal, function () {
      button.disabled = false;
      say('That’s not it. Try again.', true);
      input.value = '';
      input.focus();
    });
  });

  // Same tab, already unlocked once — don't make her type it again on reload.
  if (stored) {
    say('Opening…', false);
    button.disabled = true;
    unlock(stored).then(reveal, function () {
      try { sessionStorage.removeItem(STORE_KEY); } catch (e) {}
      stored = null;
      button.disabled = false;
      say('', false);
      input.focus();
    });
  } else {
    input.focus();
  }
})();
</script>

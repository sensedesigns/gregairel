<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Greg Airel</title>
  <meta name="description" content="Get in touch with Greg Airel — social links and contact form.">
  <meta property="og:title" content="Contact — Greg Airel">
  <meta property="og:description" content="Get in touch with Greg Airel.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/hunt.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S2DS8FJ5CM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-S2DS8FJ5CM');
  </script>
</head>
<body class="page-contact">
  <header id="site-nav"></header>

  <section class="page-header">
    <div class="container">
      <h1>Contact</h1>
      <p>Have a question, want to collaborate, or just want to say hello.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section__header">
        <span class="section__num">01</span>
        <span class="label">Elsewhere</span>
        <h2>Find me<br>online</h2><div data-daruma="9" style="display:inline-block;margin-left:.7rem;vertical-align:middle"></div>
      </div>
      <div class="social-links reveal">
        <a href="#" class="social-link">YouTube</a>
        <a href="#" class="social-link">Facebook</a>
        <a href="#" class="social-link">LinkedIn</a>
      </div>
      <p class="note" style="margin-top:1.5rem">Real social URLs still to come — these are placeholders.</p>
    </div>
  </section>

  <section class="section section--alt">
    <div class="container">
      <div class="section__header">
        <span class="section__num">02</span>
        <span class="label">Direct</span>
        <h2>Send a<br>message</h2>
      </div>
      <form class="form reveal" action="https://formsubmit.co/greg.airel@gmail.com" method="POST">
        <!-- FormSubmit config. A static form cannot post to an address on its
             own; this relays the submission on to the inbox above. -->
        <input type="hidden" name="_subject" value="New message from gregairel.com">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">
        <!-- Honeypot: bots fill it, people never see it. -->
        <input type="text" name="_honey" tabindex="-1" autocomplete="off"
               style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden" aria-hidden="true">
        <div class="form__group">
          <label class="form__label" for="name">Name</label>
          <input class="form__input" type="text" id="name" name="name" required>
        </div>
        <div class="form__group">
          <label class="form__label" for="email">Email</label>
          <input class="form__input" type="email" id="email" name="email" required>
        </div>
        <div class="form__group">
          <label class="form__label" for="message">Message</label>
          <textarea class="form__textarea" id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="btn btn--primary">Send message</button>
      </form>
      <p class="note" style="margin-top:1.5rem">Messages come straight to my inbox. I read everything, and I reply to most of it.</p>
    </div>
  </section>

  <footer id="site-footer"></footer>
  <script src="js/main.js"></script>
  <script src="js/hunt.js"></script>
  <script src="js/daruma-find.js"></script>
</body>
</html>

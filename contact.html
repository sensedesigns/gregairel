<body class="page-contact">
  <header id="site-nav"></header>

  <section class="page-header">
    <div class="container">
      <div class="head-split">
        <div class="head-split__text">
          <h1>Contact</h1>
          <p>Have a question, want to collaborate, or just want to say hello.</p>
        </div>
        <img class="portrait portrait--sm" src="img/greg-avatar.jpg" alt="Greg Airel" width="1080" height="1080">
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section__header">
        <span class="section__num">01</span>
        <span class="label">Elsewhere</span>
        <h2>Find me<br>online</h2><div data-daruma="9" style="display:inline-block;margin-left:.7rem;vertical-align:middle"></div>
      </div>
      <div class="social-links reveal">
        <a href="https://www.linkedin.com/in/greg-airel/" class="social-link" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>
  </section>

  <section class="section section--alt">
    <div class="container">
      <div class="section__header">
        <span class="section__num">02</span>
        <span class="label">Direct</span>
        <h2>Send a<br>message</h2>
      </div>
      <!-- ==================================================================
           TODO: wire up the form endpoint.

           The action is deliberately empty. It previously posted to a
           formsubmit.co endpoint with the destination address written into
           the URL, which left it in plain text in the page source where
           scrapers harvest it. Do not reintroduce it that way.

           When picking a replacement, use one that does NOT require the
           address in markup:
             - FormSubmit: submit once, then swap in the hashed alias
               endpoint it emails back (formsubmit.co/{hash}).
             - Formspree: create a form, use the issued /f/{id}.
             - Cloudflare Worker: the domain is already proxied through
               Cloudflare, so a Worker could accept the POST and relay it
               with the address held server-side.

           Until then the submit button stays disabled and the page points
           people at LinkedIn, so nothing is silently swallowed.
           ================================================================== -->
      <form class="form reveal" action="" method="POST">
        <!-- Honeypot: bots fill it, people never see it. Keep it with
             whatever endpoint replaces the empty action above. -->
        <input type="text" name="_honey" tabindex="-1" autocomplete="off"
               style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden" aria-hidden="true">
        <div class="form__group">
          <label class="form__label" for="name">Name</label>
          <input class="form__input" type="text" id="name" name="name" required>
        </div>
        <div class="form__group">
          <label class="form__label" for="email">Email</label>
          <input class="form__input" type="email" id="email" name="email" required>
        </div>
        <div class="form__group">
          <label class="form__label" for="message">Message</label>
          <textarea class="form__textarea" id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="btn btn--primary" disabled>Send message</button>
      </form>
      <p class="note" style="margin-top:1.5rem">This form isn't connected yet, so it won't send. <a href="https://www.linkedin.com/in/greg-airel/" class="text-link" target="_blank" rel="noopener">Reach me on LinkedIn</a> in the meantime.</p>
    </div>
  </section>

  <footer id="site-footer"></footer>
